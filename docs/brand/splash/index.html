.splash .vignette{ position:absolute; inset:0; pointer-events:none; z-index:5;
  background: radial-gradient(78% 60% at 50% 46%, transparent 38%, rgba(0,0,0,.55) 100%); }
.splash .grain{ position:absolute; inset:-50%; pointer-events:none; z-index:6;
  opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

/* orange glow behind the mark */
.splash .glow{ position:absolute; z-index:1; width:84%; aspect-ratio:1/1; border-radius:50%;
  background: radial-gradient(circle, var(--orange-glow) 0%, rgba(240,106,42,.16) 34%, transparent 64%);
  filter: blur(8px); opacity:0; transform:scale(.5); }

/* flare / streak that crosses along the italic lean */
.splash .flare{ position:absolute; z-index:4; top:0; bottom:0; left:0; width:26%;
  transform: translateX(-160%) skewX(-12deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0) 30%, rgba(255,210,180,.9) 50%, var(--orange) 60%, transparent 78%);
  filter: blur(2px); opacity:0; pointer-events:none; }

/* the FH mark (CSS mask over the real white PNG) */
.mark{ position:relative; z-index:3; width:64%; aspect-ratio:1200/507;
  -webkit-mask:var(--fh) center/contain no-repeat; mask:var(--fh) center/contain no-repeat; opacity:0; }
.mark .fill{ position:absolute; inset:0; background:#fff; }

/* final wordmark (italic athletic, subtle) */
.splash .wordmark{ position:absolute; z-index:3; top:64.5%;
  font-weight:800; font-style:italic; font-size:48px;
  letter-spacing:.30em; text-indent:.30em; color:#fff;
  transform: translateY(10px) skewX(-7deg); opacity:0;
  text-shadow:0 0 16px rgba(240,106,42,0); white-space:nowrap; }

/* ============================================================
   VARIANTE B — "Barrido de Energía"
   The mark starts visible but unlit (dark metal). A light-wipe
   ignites it left→right to white; a streak crosses along the
   italic lean. Dry close. (Animations play from t=0, once.)
   ============================================================ */
.splash--b .mark{ opacity:1; animation: b-markIn 1.5s var(--ease-cine) forwards; }
.splash--b .mark .fill{
  background: linear-gradient(100deg,
     #ffffff 0%, #ffffff 36%, var(--orange-soft) 43%, var(--orange) 49.5%,
     #3a2415 57%, #181009 70%, #140d07 100%);
  background-size:280% 100%; background-position:100% 0;   /* unlit side */
  animation: b-ignite 1.35s var(--ease-wipe) .15s forwards; }
.splash--b .flare{ animation: b-flare .8s var(--ease-wipe) .2s forwards; }
.splash--b .glow{ animation: b-glow 1.5s var(--ease-cine) .55s forwards; }
.splash--b .wordmark{ animation: wordIn 1s var(--ease-cine) 1.15s forwards; }

@keyframes b-markIn{
  0%   { opacity:.2; transform:scale(1.05); }
  20%  { opacity:1; }
  100% { opacity:1; transform:scale(1);
         filter:drop-shadow(0 6px 24px rgba(240,106,42,.26)); } }
@keyframes b-ignite{
  0%   { background-position:100% 0; }
  100% { background-position:0% 0; } }
@keyframes b-flare{
  0%   { transform:translateX(-160%) skewX(-12deg); opacity:0; }
  22%  { opacity:1; }
  100% { transform:translateX(420%) skewX(-12deg); opacity:0; } }
@keyframes b-glow{
  0%   { opacity:0;  transform:scale(.6); }
  55%  { opacity:.5; }
  100% { opacity:.26; transform:scale(1.04); } }
@keyframes wordIn{
  0%   { opacity:0; transform:translateY(10px) skewX(-7deg); letter-spacing:.5em; }
  100% { opacity:.9; transform:translateY(0) skewX(-7deg); letter-spacing:.30em;
         text-shadow:0 0 16px rgba(240,106,42,.22); } }
</style>
</head>

  <div id="root"
       data-composition-id="fahybrid-splash"
       data-start="0"
       data-width="1170"
       data-height="2532"
       data-duration="2.6">
    <div class="splash splash--b">
      <div class="glow"></div>
      <div class="flare"></div>
      <div class="mark"><div class="fill"></div></div>
      <div class="wordmark">FAHYBRID</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>
  </div>
