<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 24px; }
  .card { padding: 16px; }
  .row { display:flex; align-items:center; padding: 12px 16px; }
  .row + .row { border-top: 1px solid var(--hairline); }
  .row .k { flex: 1; color: var(--fg); }
  .row .v { font: var(--type-body-emph); font-variant-numeric: tabular-nums; color: var(--fg); }
  .row .v.ok { color: var(--ok); }
</style></head><body>
<div class="card" style="padding: 0;">
  <div class="row"><span class="k">Fitness (CTL)</span><span class="v">75 ▲</span></div>
  <div class="row"><span class="k">Fatiga (ATL)</span><span class="v">63 ▲</span></div>
  <div class="row"><span class="k">Frescura (TSB)</span><span class="v ok">+12 fresco</span></div>
  <div class="row"><span class="k">ACR</span><span class="v">1.1 normal</span></div>
</div>
</body></html>
