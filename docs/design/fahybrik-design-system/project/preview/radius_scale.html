<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 24px; display:flex; gap: 20px; align-items:center; justify-content: space-around; }
  .step { display:flex; flex-direction:column; align-items:center; gap: 8px; }
  .box { width: 80px; height: 56px; background: var(--surface); border: 1px solid var(--outline); }
  .name { font: var(--type-data-label); text-transform: uppercase; letter-spacing:0.16em; color: var(--muted); }
  .v { font: 500 11px/1 var(--font-mono); color: var(--fg); }
</style></head><body>
<div class="step"><div class="box" style="border-radius:6px"></div><span class="name">S</span><span class="v">6px · inputs</span></div>
<div class="step"><div class="box" style="border-radius:10px"></div><span class="name">M</span><span class="v">10px · rows</span></div>
<div class="step"><div class="box" style="border-radius:14px"></div><span class="name">L</span><span class="v">14px · cards</span></div>
<div class="step"><div class="box" style="border-radius:20px"></div><span class="name">XL</span><span class="v">20px · LAP/sheet</span></div>
<div class="step"><div class="box" style="border-radius:9999px;width:100px;height:36px"></div><span class="name">PILL</span><span class="v">9999 · chips</span></div>
</body></html>
