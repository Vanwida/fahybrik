<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 24px; }
  .scale { display:flex; align-items:flex-end; gap: 12px; }
  .step { display:flex; flex-direction:column; align-items:center; gap: 6px; }
  .box { background: var(--accent); border-radius: 4px; }
  .name { font: var(--type-data-label); text-transform: uppercase; letter-spacing:0.16em; color: var(--muted); }
  .v { font: 500 11px/1 var(--font-mono); color: var(--fg); }
</style></head><body>
<div class="scale">
  <div class="step"><div class="box" style="width:4px;height:4px"></div><span class="name">XS</span><span class="v">4</span></div>
  <div class="step"><div class="box" style="width:8px;height:8px"></div><span class="name">S</span><span class="v">8</span></div>
  <div class="step"><div class="box" style="width:12px;height:12px"></div><span class="name">M</span><span class="v">12</span></div>
  <div class="step"><div class="box" style="width:16px;height:16px"></div><span class="name">L</span><span class="v">16</span></div>
  <div class="step"><div class="box" style="width:24px;height:24px"></div><span class="name">XL</span><span class="v">24</span></div>
  <div class="step"><div class="box" style="width:32px;height:32px"></div><span class="name">XXL</span><span class="v">32</span></div>
  <div class="step"><div class="box" style="width:48px;height:48px"></div><span class="name">XXXL</span><span class="v">48</span></div>
</div>
</body></html>
