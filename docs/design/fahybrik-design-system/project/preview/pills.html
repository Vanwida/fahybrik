<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 24px; display:flex; flex-direction:column; gap: 14px; align-items:flex-start; }
  .row { display:flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style></head><body>
<div class="row">
  <span class="pill">Garmin <span style="color:var(--ok)">✓</span></span>
  <span class="pill">HR Strap <span style="color:var(--ok)">✓</span></span>
  <span class="pill">PM5 <span style="color:var(--danger)">✗</span></span>
</div>
<div class="row">
  <span class="pill pill-selected">Recreativo</span>
  <span class="pill">Competitivo</span>
  <span class="pill">Élite</span>
</div>
<div class="row">
  <span class="zone-pill" data-zone="Z1">Z1</span>
  <span class="zone-pill" data-zone="Z2">Z2</span>
  <span class="zone-pill" data-zone="Z3">Z3</span>
  <span class="zone-pill" data-zone="Z4">Z4</span>
  <span class="zone-pill" data-zone="Z5">Z5</span>
</div>
</body></html>
