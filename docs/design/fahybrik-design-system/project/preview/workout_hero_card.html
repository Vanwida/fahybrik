<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 24px; }
  .card { padding: 16px; display:flex; flex-direction:column; gap: 12px; }
  .countdown { font: var(--type-data-label); letter-spacing: 0.16em; color: var(--muted); }
  .hr { height: 1px; background: rgba(161,161,161,0.2); }
  h3 { font: 900 italic 28px/1.1 var(--font-display); }
  .meta { font: var(--type-small); color: var(--muted); }
  .cta { background: var(--accent); color: white; height: 54px; border-radius: 14px; display:flex; align-items:center; justify-content:center; font: 800 italic 16px/1 var(--font-display); letter-spacing: 0.06em; }
  .ok { display:flex; align-items:center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
</style></head><body>
<div class="card">
  <h3>Sled Push + Wall Ball Circuit</h3>
  <div class="meta">For Time · ~52 min</div>
  <div class="cta">▶ Empezar</div>
  <div class="ok"><span class="dot"></span><span class="meta">Recovery 72% · OK</span></div>
</div>
</body></html>
