<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 16px 24px; }
  .bar { display:flex; justify-content: space-around; padding: 8px 0; background: var(--surface); border-radius: 14px; }
  .tab { display:flex; flex-direction:column; align-items:center; gap: 4px; padding: 6px 12px; color: var(--muted); }
  .tab.on { color: var(--accent); }
  .glyph { width: 22px; height: 22px; border: 1.5px solid currentColor; border-radius: 4px; }
  .label { font: 600 10px/1 var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase; }
</style></head><body>
<div class="bar">
  <div class="tab on"><div class="glyph"></div><span class="label">Today</span></div>
  <div class="tab"><div class="glyph" style="border-radius:0"></div><span class="label">Plan</span></div>
  <div class="tab"><div class="glyph" style="border-radius:0"></div><span class="label">Stats</span></div>
  <div class="tab"><div class="glyph" style="border-radius:50%"></div><span class="label">Chat</span></div>
  <div class="tab"><div class="glyph" style="border-radius:50%"></div><span class="label">Perfil</span></div>
</div>
</body></html>
