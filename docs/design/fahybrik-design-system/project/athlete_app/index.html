<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FAHYBRIK · Athlete App</title>
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Geist', system-ui, sans-serif; }
    body { min-height: 100vh; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Components & screens -->
  <script type="text/babel" src="kit.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="today.jsx"></script>
  <script type="text/babel" src="workout.jsx"></script>
  <script type="text/babel" src="plan.jsx"></script>
  <script type="text/babel" src="stats.jsx"></script>
  <script type="text/babel" src="onboarding.jsx"></script>

  <!-- Frames + canvas -->
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    // Each artboard renders a single screen at variant. We freeze most to a
    // single screen, but ActiveWorkout is interactive — its LAP button advances
    // segments live inside the iPhone bezel.
    const W = 360, H = 720; // small phone for canvas density

    function Frame({ children, variant, label }) {
      // dark FAHYBRIK app, dark device
      return (
        <IOSDevice width={W} height={H} dark={true}>
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column', paddingTop: 50 }}>
            {children}
          </div>
        </IOSDevice>
      );
    }

    // ── Today artboards ──
    function TodayArtboard({ variant }) {
      return <Frame variant={variant}><TodayScreen variant={variant} onStartWorkout={()=>{}} onOpenSession={()=>{}} onOpenCheckin={()=>{}} /></Frame>;
    }

    // ── Pre-Brief ──
    function BriefArtboard({ variant }) {
      return <Frame variant={variant}><PreWorkoutBrief variant={variant} onStart={()=>{}} onClose={()=>{}} /></Frame>;
    }

    // ── Active workout (interactive) ──
    function ActiveArtboard({ variant }) {
      const [open, setOpen] = useState(true);
      return <Frame variant={variant}><ActiveWorkout variant={variant} onClose={()=>{}} onComplete={()=>{}} /></Frame>;
    }

    // ── Post-workout ──
    function PostArtboard({ variant }) {
      return <Frame variant={variant}><PostWorkout variant={variant} onSave={()=>{}} /></Frame>;
    }

    // ── Plan ──
    function PlanArtboard({ variant }) {
      return <Frame variant={variant}><PlanScreen variant={variant} /></Frame>;
    }

    // ── Stats ──
    function StatsArtboard({ variant }) {
      return <Frame variant={variant}><StatsScreen variant={variant} /></Frame>;
    }

    // ── Onboarding (interactive — advance with the CTA) ──
    function OnboardingArtboard({ variant }) {
      return <Frame variant={variant}><OnboardingFlow variant={variant} onDone={()=>{}} onClose={()=>{}} /></Frame>;
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="today" title="Today" subtitle="Daily entry · check-in nag · session card · ready meter">
            <DCArtboard id="today-safe"   label="A · Safe"   width={W} height={H}><TodayArtboard variant="safe" /></DCArtboard>
            <DCArtboard id="today-bold"   label="B · Bold"   width={W} height={H}><TodayArtboard variant="bold" /></DCArtboard>
            <DCArtboard id="today-expert" label="C · Expert" width={W} height={H}><TodayArtboard variant="expert" /></DCArtboard>
          </DCSection>

          <DCSection id="brief" title="Pre-workout brief" subtitle="Plan, zones, equipment, connections, warm-up">
            <DCArtboard id="brief-safe"   label="A · Safe"   width={W} height={H}><BriefArtboard variant="safe" /></DCArtboard>
            <DCArtboard id="brief-bold"   label="B · Bold"   width={W} height={H}><BriefArtboard variant="bold" /></DCArtboard>
            <DCArtboard id="brief-expert" label="C · Expert" width={W} height={H}><BriefArtboard variant="expert" /></DCArtboard>
          </DCSection>

          <DCSection id="active" title="Active workout" subtitle="Live timer + LAP — try tapping LAP to advance segments">
            <DCArtboard id="active-safe"   label="A · Safe — segment hero"   width={W} height={H}><ActiveArtboard variant="safe" /></DCArtboard>
            <DCArtboard id="active-bold"   label="B · Bold — total hero"     width={W} height={H}><ActiveArtboard variant="bold" /></DCArtboard>
            <DCArtboard id="active-expert" label="C · Expert — Garmin grid"  width={W} height={H}><ActiveArtboard variant="expert" /></DCArtboard>
            <DCPostIt>LAP is the signature. It's live: HR drifts, segments advance on tap.</DCPostIt>
          </DCSection>

          <DCSection id="post" title="Post-workout summary" subtitle="Zones · HR · per-segment · RPE">
            <DCArtboard id="post-safe"   label="A · Safe"   width={W} height={H}><PostArtboard variant="safe" /></DCArtboard>
            <DCArtboard id="post-bold"   label="B · Bold"   width={W} height={H}><PostArtboard variant="bold" /></DCArtboard>
            <DCArtboard id="post-expert" label="C · Expert" width={W} height={H}><PostArtboard variant="expert" /></DCArtboard>
          </DCSection>

          <DCSection id="plan" title="Plan tab" subtitle="Mes / semana / día — REAL block visible">
            <DCArtboard id="plan-safe"   label="A · Safe"   width={W} height={H}><PlanArtboard variant="safe" /></DCArtboard>
            <DCArtboard id="plan-bold"   label="B · Bold"   width={W} height={H}><PlanArtboard variant="bold" /></DCArtboard>
            <DCArtboard id="plan-expert" label="C · Expert" width={W} height={H}><PlanArtboard variant="expert" /></DCArtboard>
          </DCSection>

          <DCSection id="stats" title="Stats" subtitle="Carga · HR · Hyrox · Tendencias — sub-tabs are clickable">
            <DCArtboard id="stats-safe"   label="A · Safe"   width={W} height={H}><StatsArtboard variant="safe" /></DCArtboard>
            <DCArtboard id="stats-bold"   label="B · Bold"   width={W} height={H}><StatsArtboard variant="bold" /></DCArtboard>
            <DCArtboard id="stats-expert" label="C · Expert" width={W} height={H}><StatsArtboard variant="expert" /></DCArtboard>
          </DCSection>

          <DCSection id="onboarding" title="Onboarding · 13 pasos" subtitle="Welcome → Basics → Background → History → 1RMs → Endurance → Stations → Threshold → Training → Recovery → Goals → Connect → Done">
            <DCArtboard id="onb-safe"   label="A · Safe"   width={W} height={H}><OnboardingArtboard variant="safe" /></DCArtboard>
            <DCArtboard id="onb-bold"   label="B · Bold"   width={W} height={H}><OnboardingArtboard variant="bold" /></DCArtboard>
            <DCArtboard id="onb-expert" label="C · Expert" width={W} height={H}><OnboardingArtboard variant="expert" /></DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
