# Typecheck + unit de @fahybrid/web y @fahybrid/shared.
# No corre lint, infra, iOS, Playwright ni suites de DB.
# *.db.test.ts se saltan: este job no inyecta DATABASE_URL ni TEST_DATABASE_URL.
name: web + shared

on:
  pull_request:
    branches: [integration/trunk, main]
    paths:
      - 'web/**'
      - 'shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/test.yml'
  push:
    branches: [integration/trunk, main]
    paths:
      - 'web/**'
      - 'shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la acción lee `packageManager` del package.json (la única
      # fuente). Declarar las dos rompía el setup entero (Multiple versions of pnpm).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (shared)
        run: pnpm --filter @fahybrid/shared typecheck

      - name: Typecheck (web)
        run: pnpm --filter @fahybrid/web typecheck

      - name: Unit tests (shared)
        if: ${{ !cancelled() }}
        run: pnpm --filter @fahybrid/shared test

      - name: Unit tests (web)
        if: ${{ !cancelled() }}
        run: env -u DATABASE_URL -u TEST_DATABASE_URL pnpm --filter @fahybrid/web test
