name: FAHYBRIK
options:
  bundleIdPrefix: pro.aistudios.vanwida
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: es
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: YES

# ============================================================================
# Code signing — Alex sets these once Apple Developer Program enrolment is
# complete (see /docs/app-store/testflight-checklist.md). Until then the
# placeholders below build cleanly for the simulator (CODE_SIGNING_ALLOWED=NO).
#
# For TestFlight / App Store distribution Alex must, post-enrolment:
#   1. Replace DEVELOPMENT_TEAM `TBD` with the 10-char team ID
#      (developer.apple.com → Membership, e.g. "AB12CD34EF").
#   2. Pick CODE_SIGN_STYLE:
#        - Automatic (recommended for solo dev): Xcode manages certs/profiles.
#        - Manual: pin a specific PROVISIONING_PROFILE_SPECIFIER. Use only if
#          Fastlane match / a CI pipeline manages the profile lifecycle.
#   3. Flip CODE_SIGNING_ALLOWED + CODE_SIGNING_REQUIRED to YES on the release
#      configuration when shipping to TestFlight.
#   4. `xcodegen generate` to regenerate the .pbxproj and commit.
# ============================================================================

targets:
  FAHYBRIK:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FAHYBRIK
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: HealthKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreLocation.framework
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: AVFoundation.framework
    # ----- Info.plist -----
    # Generated by xcodegen at ios/FAHYBRIK/Generated-Info.plist. We use an
    # explicit info: block (instead of INFOPLIST_KEY_* settings) so we can
    # declare CFBundleURLTypes — an array-of-dicts that the auto-generated
    # plist build settings can't express. Sprint W4 added the `fahybrid://`
    # custom scheme for Dobles partner-invite deep links; everything else
    # below is migrated 1:1 from the previous INFOPLIST_KEY_* values.
    info:
      path: FAHYBRIK/Generated-Info.plist
      properties:
        # Consumer brand is FAHYBRID (legal + domain fahybrid.com). Internal
        # bundle id / target / project name stay FAHYBRIK (infra rename pending).
        CFBundleDisplayName: "FAHYBRID"
        # ES-only app: force Spanish for all SYSTEM-provided UI (Sign in with
        # Apple button, permission prompts, notification authorization sheet) so
        # they never render in the device language. CFBundleLocalizations declares
        # es as the sole supported localization → Bundle.preferredLocalizations =
        # ["es"] regardless of device language.
        CFBundleDevelopmentRegion: "es"
        CFBundleLocalizations:
          - es
        # Runtime environment, expanded by the Info.plist processor from the
        # active build configuration's settings (see settings.configs below):
        #   Debug   → demo backend + demo-entry button on  (simulator demos)
        #   Release → prod backend + demo-entry button off (TestFlight / SiwA)
        FahybrikApiBase: "$(FAHYBRIK_API_BASE)"
        FahybrikDemoEntry: "$(FAHYBRIK_DEMO_ENTRY)"
        CFBundleURLTypes:
          - CFBundleURLName: pro.aistudios.vanwida.fahybrik.deeplink
            CFBundleURLSchemes:
              - fahybrid
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # APNS — background delivery for silent/content-available pushes
        # (e.g. plan_published refresh). User-facing alerts don't require this
        # mode but it future-proofs background plan/chat refresh on tap.
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Privacy usage descriptions — Spanish first, mirroring the primary
        # App Store locale. Match /docs/app-store/privacy-nutrition.md.
        NSHealthShareUsageDescription: "FAHYBRID lee workouts, HR, HRV, sueño y peso de Apple Health para tu plan de entrenamiento."
        NSHealthUpdateUsageDescription: "FAHYBRID guarda los entrenos que registras en la app en Apple Health."
        NSBluetoothAlwaysUsageDescription: "FAHYBRID se conecta con tu Concept2 para registrar potencia y SPM con precisión durante row y ski erg."
        NSLocationWhenInUseUsageDescription: "FAHYBRID usa el GPS durante tus carreras para medir distancia y ritmo. Si no lo activas, puedes introducir la distancia a mano."
        NSCameraUsageDescription: "FAHYBRID usa la cámara para escanear códigos de barras de productos, analizar comida con IA (usando LiDAR cuando está disponible) y grabar vídeos de técnica para tu coach."
        NSMicrophoneUsageDescription: "FAHYBRID graba notas de voz para que envíes mensajes rápidos a tu coach por el chat."
        NSPhotoLibraryUsageDescription: "FAHYBRID adjunta fotos o vídeos de tu galería al chat con tu coach (técnica, lesiones, equipamiento)."
    settings:
      # Per-configuration runtime environment. Referenced by the Info.plist keys
      # FahybrikApiBase / FahybrikDemoEntry above and expanded at build time.
      # This is what makes a plain `xcodebuild -configuration Debug` reliably
      # carry the demo backend — the values live in the committed project (and
      # the regenerated .pbxproj), NOT in the gitignored Generated-Info.plist.
      configs:
        Debug:
          FAHYBRIK_API_BASE: "https://fahybrik-demo.vercel.app"
          FAHYBRIK_DEMO_ENTRY: "1"
        Release:
          FAHYBRIK_API_BASE: "https://fahybrik-web.vercel.app"
          FAHYBRIK_DEMO_ENTRY: "0"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.aistudios.vanwida.fahybrik
        CODE_SIGN_ENTITLEMENTS: FAHYBRIK/FAHYBRIK.entitlements
        PRODUCT_NAME: FAHYBRIK
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandAccent
        DEVELOPMENT_ASSET_PATHS: "\"FAHYBRIK/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        # Disable auto-generated plist — we provide our own via info: block.
        GENERATE_INFOPLIST_FILE: NO
        # ----- Code signing — vanwida Apple Developer (Team S6W4459DDG) -----
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S6W4459DDG
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

  FAHYBRIKTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FAHYBRIKTests
    dependencies:
      - target: FAHYBRIK
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: pro.aistudios.vanwida.fahybrik.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FAHYBRIK.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FAHYBRIK"
        # Skip code signing for tests on simulator. Signing the host app
        # already covers the bundle-loader linkage.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.10"

  FAHYBRIKWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: FAHYBRIKWatch
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.aistudios.vanwida.fahybrik.watchkitapp
        CODE_SIGN_ENTITLEMENTS: FAHYBRIKWatch/FAHYBRIKWatch.entitlements
        PRODUCT_NAME: FAHYBRIKWatch
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: "FAHYBRID"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: pro.aistudios.vanwida.fahybrik
        INFOPLIST_KEY_WKWatchOnly: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: "FAHYBRID lee tu HR y consumo calórico durante el entreno para registrar la sesión con precisión."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "FAHYBRID guarda en Apple Health los entrenos que registras desde el reloj."
        ENABLE_PREVIEWS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        # ----- Code signing — vanwida Apple Developer (Team S6W4459DDG) -----
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S6W4459DDG
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

# ============================================================================
# Schemes — explicit so `xcodebuild test` knows which targets to build and
# which tests to execute. The default xcodegen-generated scheme for the
# FAHYBRIK app does not wire the FAHYBRIKTests bundle into its test action.
# ============================================================================
schemes:
  FAHYBRIK:
    build:
      targets:
        FAHYBRIK: all
        FAHYBRIKTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FAHYBRIKTests
      gatherCoverageData: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
