name: FAHYBRIK
options:
  # Solo lo usaría xcodegen para un target SIN PRODUCT_BUNDLE_IDENTIFIER propio, y
  # los cinco lo tienen (todos derivados de BRAND_BUNDLE_ID, más abajo). Se queda
  # como red por si algún día nace un target sin id: al clonar hay que moverlo
  # igual, porque un prefijo de otra marca aquí pasaría desapercibido.
  bundleIdPrefix: com.fahybrid
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: es
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    # ========================================================================
    # LA MARCA, EN CUATRO LÍNEAS Y UNA SOLA VEZ.
    #
    # Este código se vende a otros entrenadores, así que antes o después habrá
    # una SEGUNDA app iOS con otro nombre, otro bundle y otro dominio. Hasta
    # ahora eso eran ~30 literales repartidos: el nombre visible en tres
    # Info.plist, dentro de diez descripciones de permisos, el bundle id en
    # cinco targets más la clave que ata el reloj al teléfono, el esquema de
    # URL en dos sitios y el dominio en el entitlement y en cuatro ficheros
    # Swift. Encontrarlos todos era el trabajo, y olvidar uno no rompe la
    # build: sale a la cara del atleta (un permiso que nombra a otra marca) o
    # deja al reloj sin emparejar.
    #
    # Ahora los cuatro valores viven AQUÍ y todo lo demás los expande:
    #   · Info.plist de app / reloj / widgets  → "$(BRAND_…)"
    #   · entitlements (associated domains)    → "$(BRAND_WEB_DOMAIN)"
    #   · Swift                                → `Marca` los lee del bundle
    #
    # Lo que NO se toca al clonar y por qué está en docs/ios-clonabilidad.md
    # (claves de almacenamiento, id de Connect IQ, appId de Zepp, firma).
    # ========================================================================
    #
    # Nombre visible al atleta. Es lo que aparece bajo el icono, en las hojas
    # de permisos del sistema y en Ajustes.
    BRAND_DISPLAY_NAME: FAHYBRID
    # Bundle id de la app del teléfono. El reloj, los widgets y los dos bundles
    # de test cuelgan de él por sufijo — una extensión DEBE ir prefijada por su
    # host o el empotrado se rechaza.
    BRAND_BUNDLE_ID: com.fahybrid.app
    # Dominio público de la marca: web de cuenta, legales, origen que valida el
    # reproductor incrustado y los `applinks:` del entitlement. El backend de la
    # app es OTRO ajuste (FAHYBRIK_API_BASE, por configuración) porque puede
    # apuntar a otro entorno sin cambiar de marca.
    BRAND_WEB_DOMAIN: fahybrid.com
    # Esquema propio para los enlaces profundos (invitación de pareja de Dobles).
    # Dos apps instaladas en el mismo teléfono NO pueden compartirlo: el sistema
    # entrega el enlace a una de las dos, sin criterio estable.
    BRAND_URL_SCHEME: fahybrid
    # LA VERSIÓN, UNA SOLA VEZ Y PARA LOS TRES TARGETS.
    #
    # Estaba escrita tres veces (app, reloj, widgets) con el mismo número a mano.
    # Mientras coincidan no pasa nada; el día que alguien suba la del teléfono y
    # se deje la del reloj, watchOS deja de ver el binario del reloj como una
    # actualización y NO lo instala — la muñeca se queda en la versión anterior
    # sin decir nada. Eso es exactamente el susto de esta mañana (allí fue por el
    # camino de desarrollo), pero en producción y sin forma de que el atleta lo
    # sepa. Con la versión aquí arriba, divergir deja de ser posible.
    # Bump on every device install that must refresh the companion watch app —
    # same CFBundleVersion as the previous install often leaves the wrist on the
    # old binary (Alex hit this testing sensor rep-count).
    CURRENT_PROJECT_VERSION: 24
    MARKETING_VERSION: "1.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: YES
    # ----- EL EQUIPO DE FIRMA, UNA SOLA VEZ Y PARA TODOS LOS TARGETS -----
    #
    # Estaba escrito CUATRO veces (app, reloj, widgets y el comentario de más
    # abajo), y las cuatro tenían que coincidir. Divergir no rompe la build de
    # simulador: rompe el archivado, y lo rompe tarde — el reloj o el widget
    # firmado con otro equipo hace que el empotrado se rechace al subir a
    # TestFlight, con la hora de build ya gastada. Aquí arriba, divergir deja
    # de ser posible; cada target lo HEREDA.
    #
    # Team de firma de ESTE binario (Vanwida). Una sola vez: app, reloj y
    # widgets lo heredan. `TBD` se descartó — cada xcodegen o bump de pbxproj
    # devolvía "Automatic signing with no team" y el Owner tenía que
    # reescribirlo en cada build de dispositivo. Un clon cambia esta línea;
    # no se escribe el team en cada target. CODE_SIGN_STYLE se queda Automatic.
    # Checklist: docs/app-store/testflight-checklist.md
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: S6W4459DDG

targets:
  FAHYBRIK:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FAHYBRIK
      # El dominio compartido con la muñeca. Ver el bloque FAHYBRIKCore de abajo:
      # el teléfono y el reloj incluyen esta MISMA carpeta, así que la pertenencia
      # la decide dónde vive el fichero y no una lista que alguien deba recordar.
      - path: FAHYBRIKCore
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: HealthKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreLocation.framework
      # El BARÓMETRO del teléfono (CMAltimeter) — la altitud de una carrera al aire
      # libre, que hasta ahora no se capturaba en absoluto. Sin ella no hay desnivel
      # acumulado ni ritmo ajustado por pendiente. La vertical del GPS no vale para
      # eso (decenas de metros de error); el barómetro sí, y el GPS le pone el cero.
      # Ver FAHYBRIK/Workout/Outdoor/RunAltimeter.swift.
      - sdk: CoreMotion.framework
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: AVFoundation.framework
      # Apple Watch native workouts (#48): schedules the athlete's upcoming RUNS
      # into the watch's own Entrenamiento app, so a run starts from the wrist
      # with no phone. No entitlement and no Apple approval are involved — the
      # only gate is WorkoutScheduler.requestAuthorization() at runtime.
      - sdk: WorkoutKit.framework
      # Deterministic ids for those scheduled workouts (SHA-256 over the
      # assignment id) — the key that lets a re-sync recognise, update and retire
      # exactly the entries we put there. See FahybrikWorkoutPlanID.
      - sdk: CryptoKit.framework
      # Outdoor run live tracking (#64): ActivityKit starts/updates the Live
      # Activity from the app; WidgetKit is pulled in transitively by the widget
      # extension but is listed here for the app's own ActivityKit surface.
      - sdk: ActivityKit.framework
      # The watch app must ship INSIDE the iPhone app (Embed Watch Content):
      # without it iOS never links the two installs, the phone reports
      # isWatchAppInstalled=false and silently drops every wrist push — and a
      # TestFlight archive would not include the watch app at all.
      - target: FAHYBRIKWatch
      # The widget extension (#64) must ship INSIDE the app (Embed PlugIns) so the
      # Live Activity / Dynamic Island is available at runtime.
      - target: FAHYBRIKWidgets
    # ----- Info.plist -----
    # Generated by xcodegen at ios/FAHYBRIK/Generated-Info.plist. We use an
    # explicit info: block (instead of INFOPLIST_KEY_* settings) so we can
    # declare CFBundleURLTypes — an array-of-dicts that the auto-generated
    # plist build settings can't express. Sprint W4 added the `fahybrid://`
    # custom scheme for Dobles partner-invite deep links; everything else
    # below is migrated 1:1 from the previous INFOPLIST_KEY_* values.
    info:
      path: FAHYBRIK/Generated-Info.plist
      properties:
        # Consumer brand is FAHYBRID (legal + domain fahybrid.com). Internal
        # target / project name stay FAHYBRIK (infra rename pending). El valor
        # sale de BRAND_DISPLAY_NAME (settings.base) — no se escribe aquí.
        CFBundleDisplayName: "$(BRAND_DISPLAY_NAME)"
        # ES-only app: force Spanish for all SYSTEM-provided UI (Sign in with
        # Apple button, permission prompts, notification authorization sheet) so
        # they never render in the device language. CFBundleLocalizations declares
        # es as the sole supported localization → Bundle.preferredLocalizations =
        # ["es"] regardless of device language.
        CFBundleDevelopmentRegion: "es"
        CFBundleLocalizations:
          - es
        # Version — single source of truth. Both keys expand at build time from
        # the MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings
        # (settings.base) so there is no second literal that can drift.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance: app uses only standard HTTPS (exempt) — declared so
        # TestFlight skips the per-upload encryption prompt.
        ITSAppUsesNonExemptEncryption: false
        # Live Activities (#64) — the outdoor run's lock-screen + Dynamic Island.
        # Required for ActivityKit's Activity.request to be permitted at runtime.
        NSSupportsLiveActivities: true
        # Runtime environment, expanded by the Info.plist processor from the
        # active build configuration's settings (see settings.configs below):
        #   Debug   → demo backend + demo-entry button on  (simulator demos)
        #   Release → prod backend + demo-entry button off (TestFlight / SiwA)
        FahybrikApiBase: "$(FAHYBRIK_API_BASE)"
        FahybrikDemoEntry: "$(FAHYBRIK_DEMO_ENTRY)"
        # El dominio público de la marca, expuesto al código: `Marca` (Swift) lo
        # lee de aquí en vez de repetir "fahybrid.com" en cada pantalla legal.
        # Mismo origen que los `applinks:` del entitlement.
        BrandWebDomain: "$(BRAND_WEB_DOMAIN)"
        CFBundleURLTypes:
          - CFBundleURLName: "$(BRAND_BUNDLE_ID).deeplink"
            CFBundleURLSchemes:
              - "$(BRAND_URL_SCHEME)"
        # Compartir a Instagram Stories (card 132): el esquema para poder
        # preguntar canOpenURL, y el App ID de Meta que su contrato exige en
        # `source_application`. El App ID es una cuenta de Meta que crea Alex;
        # VACÍO = el botón directo a Instagram no se ofrece y queda la hoja del
        # sistema. Al rellenarlo, el botón aparece solo (CompartirService).
        LSApplicationQueriesSchemes:
          - instagram-stories
        MetaAppID: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # APNS — background delivery for silent/content-available pushes
        # (e.g. plan_published refresh). User-facing alerts don't require this
        # mode but it future-proofs background plan/chat refresh on tap.
        #
        # `audio` — the live EMOM/interval timer plays the every-minute beep + the
        # last-3s ticks through an AVAudioEngine (see WorkoutAudio). Keeping that
        # engine running while the EMOM is active holds background execution so the
        # cue STILL fires with the screen locked / phone pocketed mid-workout.
        # `location` (#64) — an OUTDOOR run keeps measuring distance/pace/route and
        # closing tramos with the screen locked / phone pocketed.
        # allowsBackgroundLocationUpdates is enabled ONLY during an active outdoor
        # run and disabled the moment it ends (RunLocationProvider.setBackgroundUpdates).
        # `bluetooth-central` — an INDOOR workout with NO audio cue and NO GPS (a
        # strength session with just a HR strap, or an erg / treadmill set) would
        # otherwise be suspended the instant the screen locks, and the pulse / belt /
        # PM5 telemetry would stop arriving mid-set. This mode keeps CoreBluetooth
        # streaming while the phone is pocketed — the same background BLE Zwift,
        # Wahoo and Peloton rely on.
        UIBackgroundModes:
          - remote-notification
          - audio
          - location
          - bluetooth-central
        UILaunchScreen:
          UILaunchScreen: {}
        # PORTRAIT-ONLY on iPhone (IMG_2386): landscape existed by accident and
        # every accidental layout hid buttons under the edge. The gym-app standard
        # is deliberate orientation — if a screen ever EARNS landscape (video, a
        # live HUD), it opts in locally; the app default is portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Privacy usage descriptions — Spanish first, mirroring the primary App
        # Store locale. Match /docs/app-store/privacy-nutrition.md. ONLY the
        # permissions actually requested in reachable code are declared:
        #   HealthKit   → HealthKitPermissions.requestAuthorization (AppRoot)
        #   Bluetooth   → PM5Service CBCentralManager (Concept2 PM5)
        #   Location    → WorkoutLiveDataSources requestWhenInUseAuthorization
        #   Camera      → WorkoutCaptureView CameraPicker (foto del resumen de
        #                 otra app; reutilizado por la foto de perfil en
        #                 FotoPerfilSheet) + chat photo/video capture
        #                 (ChatCameraPicker), all guarded by isSourceTypeAvailable.
        #   Microphone  → chat voice notes (VoiceRecorderEngine / AVAudioRecorder,
        #                 requested via AVAudioApplication.requestRecordPermission).
        #   PhotoLibrary→ chat gallery attachments (ChatMediaLibraryPicker /
        #                 PHPickerViewController). NOTE: the athlete's profile
        #                 photo uses SwiftUI's PhotosPicker, which runs
        #                 out-of-process and needs NO photo-library permission —
        #                 the string below stays about the chat on purpose.
        # The camera string no longer mentions the food-barcode scanner: that
        # Nutrition path is unreachable (hidden), so the copy names only the
        # reachable camera uses (chat capture + workout-summary photo + the
        # athlete's own profile photo).
        NSCameraUsageDescription: "$(BRAND_DISPLAY_NAME) usa la cámara para hacer tu foto de perfil, para las fotos y vídeos que envías a tu coach en el chat, para fotografiar el resumen de otra app (Garmin, Coros, Concept2…) y que la IA rellene tu resultado, y para medir la altura de tus saltos."
        NSMicrophoneUsageDescription: "$(BRAND_DISPLAY_NAME) usa el micrófono para grabar las notas de voz que envías a tu coach en el chat."
        NSPhotoLibraryUsageDescription: "$(BRAND_DISPLAY_NAME) accede a tus fotos y vídeos para que puedas adjuntarlos en el chat con tu coach."
        NSHealthShareUsageDescription: "$(BRAND_DISPLAY_NAME) lee workouts, pulso, VFC, sueño, peso y la distancia que recorres de Apple Salud, para tu plan de entrenamiento y para comprobar que la distancia que medimos en tus carreras cuadra con la tuya."
        NSHealthUpdateUsageDescription: "$(BRAND_DISPLAY_NAME) guarda los entrenos que registras en la app en Apple Health."
        NSBluetoothAlwaysUsageDescription: "$(BRAND_DISPLAY_NAME) se conecta con tu cinta y con tu Concept2 para leer ritmo, velocidad e inclinación en vivo, y con tu reloj o banda para tu pulso durante el entreno."
        NSLocationWhenInUseUsageDescription: "$(BRAND_DISPLAY_NAME) usa el GPS durante tus carreras para medir distancia, ritmo y tu recorrido, incluso con la pantalla bloqueada. Si no lo activas, puedes introducir la distancia a mano."
        #   Movimiento → RunAltimeter (CMAltimeter) en una carrera al aire libre. Se
        #                pide junto con el GPS al empezar a correr fuera, nunca en
        #                cinta ni en el gimnasio. Si no se da, la carrera se guarda
        #                igual: se queda sin desnivel, no sin carrera.
        NSMotionUsageDescription: "$(BRAND_DISPLAY_NAME) usa los sensores del móvil en tus carreras al aire libre para medir el desnivel que subes y bajas. Si no lo activas, tu carrera se guarda igual, pero sin desnivel."
    settings:
      # Per-configuration runtime environment. Referenced by the Info.plist keys
      # FahybrikApiBase / FahybrikDemoEntry above and expanded at build time.
      # This is what makes a plain `xcodebuild -configuration Debug` reliably
      # carry the demo backend — the values live in the committed project (and
      # the regenerated .pbxproj), NOT in the gitignored Generated-Info.plist.
      configs:
        Debug:
          # app.fahybrid.com is the STABLE seam to the app backend: today it points
          # at the current backend project; at the single-production cutover the
          # DOMAIN moves and every installed build lands on production without a
          # rebuild. Never point builds at a *.vercel.app project name again.
          #
          # Se deriva de BRAND_WEB_DOMAIN para que un clon no tenga que acordarse
          # de mover también esto, pero SIGUE siendo un ajuste por configuración:
          # si algún día hace falta apuntar a otro entorno sin cambiar de marca,
          # se escribe el host aquí y se acabó.
          FAHYBRIK_API_BASE: "https://app.$(BRAND_WEB_DOMAIN)"
          FAHYBRIK_DEMO_ENTRY: "1"
          # DEBUG compilation flag lives ONLY here (Debug). It must NEVER reach
          # Release: under #if DEBUG, PushManager reports apns_env="sandbox" (so a
          # production token fails silently) and the demo-login entry can surface.
          # TestFlight/App Store = Release = no DEBUG → production push + SiwA-only.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # Development APNS entitlement (aps-environment=development) for local /
          # simulator push during dev.
          CODE_SIGN_ENTITLEMENTS: FAHYBRIK/FAHYBRIK-Debug.entitlements
        Release:
          # SAME backend as Debug — one production universe for every build. The
          # domain is the stable seam (see Debug note); TestFlight/App Store users
          # must land where the real plans, executions and coach loop live.
          FAHYBRIK_API_BASE: "https://app.$(BRAND_WEB_DOMAIN)"
          FAHYBRIK_DEMO_ENTRY: "0"
          # Production APNS entitlement (aps-environment=production) for TestFlight
          # / App Store distribution. Pairs with the no-DEBUG Release build above.
          CODE_SIGN_ENTITLEMENTS: FAHYBRIK/FAHYBRIK-Release.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRAND_BUNDLE_ID)"
        # CODE_SIGN_ENTITLEMENTS is per-config (see configs above): Release ships
        # aps-environment=production, Debug=development.
        PRODUCT_NAME: FAHYBRIK
        # Versión: heredada del `settings.base` del proyecto — ver allí el porqué.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandAccent
        DEVELOPMENT_ASSET_PATHS: "\"FAHYBRIK/Preview Content\""
        ENABLE_PREVIEWS: YES
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG is set per-config (Debug only).
        # Disable auto-generated plist — we provide our own via info: block.
        GENERATE_INFOPLIST_FILE: NO
        # CODE_SIGN_STYLE + DEVELOPMENT_TEAM se HEREDAN de settings.base — ver
        # allí el porqué de tenerlos en un solo sitio.
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

  FAHYBRIKUITests:
    # LA VERIFICACIÓN QUE FALTABA: navegar la app DE VERDAD y fotografiarla.
    # El volcado por ImageRenderer prueba pantallas aisladas; el contenedor con
    # sus pastillas necesita el ciclo de vida vivo, y eso solo lo da XCUITest
    # corriendo dentro del simulador — sin automatizar el escritorio de nadie.
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FAHYBRIKUITests
    dependencies:
      - target: FAHYBRIK
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRAND_BUNDLE_ID).uitests"
        TEST_TARGET_NAME: FAHYBRIK
        CODE_SIGNING_ALLOWED: NO

  FAHYBRIKTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FAHYBRIKTests
    dependencies:
      - target: FAHYBRIK
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRAND_BUNDLE_ID).tests"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FAHYBRIK.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FAHYBRIK"
        # Skip code signing for tests on simulator. Signing the host app
        # already covers the bundle-loader linkage.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.10"

  FAHYBRIKWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    # ESQUEMA COMPARTIDO, y no es cosmética.
    #
    # Sólo estaba compartido el de la app del iPhone; el del reloj lo creaba Xcode
    # a mano en cada máquina y no vivía en el repo. Consecuencia práctica: instalar
    # el binario del iPhone NO empuja de forma fiable la app del reloj a un reloj ya
    # emparejado (eso lo hace la app Watch a su ritmo), y sin este esquema no había
    # una forma versionada de instalarla DIRECTAMENTE en la muñeca. Con él,
    # `xcodebuild -scheme FAHYBRIKWatch -destination 'platform=watchOS,name=<reloj>'`
    # —o elegirlo en Xcode— pone la build de hoy en el reloj sin pasar por el
    # teléfono, que es justo lo que faltaba para poder probar.
    scheme:
      testTargets: []
    sources:
      - path: FAHYBRIKWatch
      # ----- EL DOMINIO COMPARTIDO, POR CARPETA Y NO POR LISTA -----
      # Aquí vivían enumerados a mano los ~50 ficheros que el reloj comparte con
      # el teléfono. La asimetría era el fallo: el teléfono los recibía por incluir
      # su árbol entero (`- path: FAHYBRIK`) y sólo la muñeca los nombraba uno a
      # uno, así que «esto es compartido» no se veía en el fichero — se veía en una
      # lista de este YAML, lejos. Cada fichero nuevo del dominio dependía de que
      # alguien recordara añadir su línea, y olvidarla no siempre rompía la build:
      # a veces la muñeca se quedaba con SU PROPIA copia, que es de donde salieron
      # los `position` de una carrera estructurada colapsando en una sola fila al
      # llegar al servidor, las rondas de EMOM, la pendiente y el detalle del erg.
      #
      # Ahora la pertenencia la decide DÓNDE VIVE el fichero: `ios/FAHYBRIKCore/`
      # se incluye entera desde los dos targets, así que un fichero nuevo del
      # dominio entra en ambos sin tocar este YAML, y no hay nada que olvidar.
      #
      # NO es un módulo Swift aparte, y es a propósito: `Workout/WorkoutModels.swift`
      # lleva los envíos a la red bajo `#if !os(watchOS)` y esos alcanzan APIClient /
      # RequestQueue, que viven en la app — un framework no puede depender de su host.
      # Compilando en el mismo módulo tampoco hace falta `public` ni `import` en cada
      # pantalla, y FAHYBRIKTests (iOS) sigue llegando al dominio para probarlo.
      #
      # EL GUARDIÁN ES LA BUILD NORMAL: la app embute la app del reloj, así que
      # cualquier cosa que se meta en FAHYBRIKCore y no sea portable a watchOS
      # revienta el `xcodebuild -scheme FAHYBRIK` de todos los días, no una build
      # especial que nadie corre.
      #
      # Lo que se queda FUERA a propósito: el PINTADO (Theme/Theme.swift,
      # Theme/LenguajeVivoUI.swift, Theme/Haptics.swift → en la muñeca
      # FAHYBRIKWatch/WatchHaptics.swift y su WatchTheme), el trato con el cable
      # (Watch/WatchConnectivityiOSService.swift), el BLE (Devices/PM5/PM5Service.swift),
      # la captura de CoreMotion (FAHYBRIKWatch/Sensor/SensorCapture.swift), la SUBIDA
      # (Workout/Trace/WorkoutTraceUploader.swift) y `GuionEscaparate` — el único guion
      # que instancia vistas del reloj. Ver docs/DECISIONS.md (2026-08-17).
      - path: FAHYBRIKCore
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: CoreMotion.framework
    # ----- Info.plist -----
    # Explicit info: block (like the iOS target) because WKBackgroundModes is an
    # array the INFOPLIST_KEY_* settings can't express. workout-processing keeps
    # the app running — and the HKWorkoutSession recording — with the wrist down
    # mid-session; standalone and mirror mode both depend on it. All other keys
    # migrated 1:1 from the previous INFOPLIST_KEY_* values.
    info:
      path: FAHYBRIKWatch/Generated-Info.plist
      properties:
        CFBundleDisplayName: "$(BRAND_DISPLAY_NAME)"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Mismo dominio de marca que la app del teléfono: `Marca` compila también
        # en el reloj (vive en FAHYBRIKCore) y lo lee de su propio bundle.
        BrandWebDomain: "$(BRAND_WEB_DOMAIN)"
        WKApplication: true
        # ALWAYS-ON, DECLARADO. Sin esta clave el sistema nunca entrega el estado
        # atenuado: todo el trabajo de `isLuminanceReduced` del lienzo sería
        # decoración y al bajar la muñeca la app se iría a la esfera. Es la queja
        # número uno contra las apps de entreno de terceros, y no se arregla con
        # código — se declara aquí.
        WKSupportsAlwaysOnDisplay: true
        # LA CLAVE QUE ATA EL RELOJ AL TELÉFONO. Si no coincide EXACTAMENTE con
        # el bundle id de la app del teléfono, watchOS no reconoce la pareja: el
        # teléfono reporta isWatchAppInstalled=false y tira cada push a la
        # muñeca sin avisar. Por eso se expande del mismo ajuste, no se copia.
        WKCompanionAppBundleIdentifier: "$(BRAND_BUNDLE_ID)"
        WKWatchOnly: false
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "$(BRAND_DISPLAY_NAME) lee tu HR y consumo calórico durante el entreno para registrar la sesión con precisión."
        NSHealthUpdateUsageDescription: "$(BRAND_DISPLAY_NAME) guarda en Apple Health los entrenos que registras desde el reloj."
    settings:
      configs:
        Debug:
          # DEBUG only in Debug (mirrors the app target); never in Release so the
          # archived watch build is a true production build.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRAND_BUNDLE_ID).watchkitapp"
        CODE_SIGN_ENTITLEMENTS: FAHYBRIKWatch/FAHYBRIKWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: FAHYBRIKWatch
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG is set per-config (Debug only).
        # CODE_SIGN_STYLE + DEVELOPMENT_TEAM se HEREDAN de settings.base.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

  # ----- Widget extension (#64) — Live Activity + Dynamic Island -----
  # Embedded in the app (see the app target's `- target: FAHYBRIKWidgets` dep).
  # Bundle id = the app's real id + ".widgets" (an extension MUST be prefixed by
  # its host, else the embed is rejected). Deployment target = the app's (18.0);
  # a target ABOVE the host breaks the embed. Regenerate the .pbxproj with
  # `xcodegen generate` after any change here (same as the watch target).
  FAHYBRIKWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FAHYBRIKWidgets
      # The Live Activity data contract, compiled into BOTH the app and this
      # extension so the ContentState shape is single-sourced and the two sides
      # can never desync.
      #
      # Sigue siendo UNA LÍNEA A MANO, y no es un olvido: este es el eje
      # app↔widget, no el app↔reloj. FAHYBRIKCore existe para lo que compila en
      # watchOS, y este fichero es ActivityKit — no pinta ahí. Si el eje del
      # widget crece más allá de un fichero, merecerá su propia raíz compartida
      # con el mismo criterio, no un hueco en la del reloj.
      - path: FAHYBRIK/Workout/Outdoor/RunActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    # Explicit info: block (like the app/watch) because NSExtension is a nested
    # dict the INFOPLIST_KEY_* settings can't express.
    info:
      path: FAHYBRIKWidgets/Generated-Info.plist
      properties:
        CFBundleDisplayName: "$(BRAND_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRAND_BUNDLE_ID).widgets"
        PRODUCT_NAME: FAHYBRIKWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO
        # CODE_SIGN_STYLE + DEVELOPMENT_TEAM se HEREDAN de settings.base.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

# ============================================================================
# Schemes — explicit so `xcodebuild test` knows which targets to build and
# which tests to execute. The default xcodegen-generated scheme for the
# FAHYBRIK app does not wire the FAHYBRIKTests bundle into its test action.
# ============================================================================
schemes:
  FAHYBRIK:
    # BUILD DE SIMULADOR — comando oficial:
    #
    #   xcodebuild -project ios/FAHYBRIK.xcodeproj -scheme FAHYBRIK \
    #     -destination 'generic/platform=iOS Simulator' build
    #
    # SIEMPRE con -destination, NUNCA con `-sdk iphonesimulator`: -sdk fuerza el
    # SDK del iPhone a TODOS los targets del grafo, incluido el reloj (watchOS).
    # actool compila entonces el catálogo del reloj con --platform iphonesimulator
    # — su AppIcon (solo watchos) queda sin contenido aplicable y el build muere
    # con exit 65; los __preview.dylib del reloj y de los widgets fallan al
    # enlazar por el mismo SDK equivocado. Con -destination, xcodebuild lleva
    # cada dependencia a su plataforma (reloj → watchsimulator) y el esquema
    # entero compila. Para correr en un simulador concreto, cambia el destination
    # a 'platform=iOS Simulator,name=iPhone 17 Pro'.
    build:
      targets:
        FAHYBRIK: all
        FAHYBRIKTests: [test]
        FAHYBRIKUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # ORDEN ALEATORIO. Por defecto XCTest ejecuta en orden alfabético, siempre el
        # mismo, así que una prueba que dependa del estado que dejó otra pasa mil veces
        # seguidas y falla el día que alguien añade un fichero que cambia el orden — o
        # falla en la máquina de al lado y no en la tuya. Aleatorizando, esa clase de
        # fallo sale a la primera y no se puede esconder. (12-ago: se activó buscando
        # justo eso, un recuento que no cuadraba entre dos máquinas.)
        - name: FAHYBRIKTests
          randomExecutionOrder: true
        # En el esquema para poder invocarlo, pero su test se AUTO-SALTA sin
        # UITEST_BEARER, así que un `test` completo no falla por él. Corre a mano:
        #   UITEST_BEARER=… xcodebuild test -only-testing:FAHYBRIKUITests
        - name: FAHYBRIKUITests

      gatherCoverageData: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
